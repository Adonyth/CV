<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Not in this sky · Jiaxuan Chen</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --page:#0b0a09; --ink:#f4f0e8; --body:#bdb6a8; --muted:#8a8276; --accent:#e0876a; --gold:#e8c37a; --hair:rgba(255,255,255,.10);
            --serif:"Newsreader",Georgia,serif; --mono:"JetBrains Mono",ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; background:var(--page); color:var(--body); }
    body { min-height:100vh; display:grid; place-items:center; padding:48px 20px; font-family:var(--serif);
           background:radial-gradient(ellipse at 50% 30%, rgba(232,195,122,.06), transparent 60%), var(--page); }
    main { max-width:560px; width:100%; }
    .eyebrow { font-family:var(--mono); font-size:11.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--gold); }
    h1 { font-weight:500; color:var(--ink); font-size:clamp(30px, 6vw, 44px); line-height:1.15; margin:14px 0 6px; letter-spacing:-.01em; }
    .zh { font-size:.62em; color:var(--muted); margin-left:.3em; }
    p { font-size:17px; line-height:1.7; margin:14px 0 0; }
    nav { margin-top:32px; padding-top:20px; border-top:1px solid var(--hair); display:flex; flex-wrap:wrap; gap:10px; }
    a { font-family:var(--mono); font-size:12.5px; letter-spacing:.04em; color:var(--body); text-decoration:none;
        padding:9px 14px; border:1px solid var(--hair); border-radius:999px; transition:color .2s, border-color .2s; }
    a:hover, a:focus-visible { color:var(--accent); border-color:var(--accent); outline:none; }
    a.home { color:var(--ink); border-color:rgba(224,135,106,.5); }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">404 · not in this sky</div>
    <h1>This page isn’t here <span class="zh" lang="zh">此页不存在</span></h1>
    <p>The address may have moved when the site was rebuilt, or it never existed. Everything that does exist is one step away.</p>
    <p lang="zh">这个地址可能在网站重建时移动了，也可能从未存在。所有存在的页面都在下面一步之遥。</p>
    <nav aria-label="Ways back">
      <a class="home" href="/">⌂ Home · 星空</a>
      <a href="/#index">All pages · 全部页面</a>
      <a href="/cv.html">CV · 履历</a>
      <a href="/updates.html">Latest · 近况</a>
    </nav>
  </main>
</body>
</html>
