<!DOCTYPE html>
<html lang="en" class="locale-en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b0a09" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Latest · 近况 · Jiaxuan Chen</title>
  <meta name="description" content="Recent activity — preprints, talks, products, writing — from Jiaxuan Chen (陈嘉轩)." />
  <link rel="canonical" href="https://cv-2ad.pages.dev/updates.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Latest · 近况 · Jiaxuan Chen" />
  <meta property="og:url" content="https://cv-2ad.pages.dev/updates.html" />
  <meta property="og:image" content="https://cv-2ad.pages.dev/og-cover.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="alternate" type="application/rss+xml" title="Jiaxuan Chen — Latest" href="/updates.xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;box-sizing:border-box}
    body{background:#0b0a09;color:#e9e0d2;font-family:'Newsreader',Georgia,serif;line-height:1.6;-webkit-font-smoothing:antialiased}
    .wrap{max-width:760px;margin:0 auto;padding:64px 24px 96px}
    .chrome{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}
    .back{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.05em;color:#b9ab93;text-decoration:none;
      border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:9px 16px;transition:color .2s ease,border-color .2s ease,background .2s ease}
    .back:hover{color:#e6b989;border-color:#e0876a}
    .lang button{background:none;border:0;color:#8f8067;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;padding:4px 6px}
    .lang button[aria-pressed="true"]{color:#f4ecdf}
    .eyebrow{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#e0876a;margin-bottom:10px}
    h1{font-family:'Newsreader',Georgia,serif;font-size:clamp(31px,2.2rem + 1.1vw,46px);font-weight:500;letter-spacing:-.01em;margin-bottom:8px}
    .sub{color:#b9ab93;margin-bottom:40px}
    .rss{color:#8f8067;font-family:'JetBrains Mono',monospace;font-size:12px;text-decoration:none}
    .rss:hover{color:#e0876a}
    ol{list-style:none}
    li{padding:22px 0;border-top:1px solid rgba(255,255,255,.09);display:flex;gap:22px;flex-wrap:wrap}
    li:first-child{border-top:0}
    .date{font-family:'JetBrains Mono',monospace;font-size:13px;color:#9a8a6f;min-width:88px;padding-top:3px;letter-spacing:.02em}
    .body{flex:1;min-width:240px}
    .body a.go{color:inherit;text-decoration:none;border-bottom:1px solid rgba(224,150,90,.35)}
    .body a.go:hover{color:#e6b989;border-color:#e6b989}
    .i18n-zh{display:none}
    html.locale-zh .i18n-en{display:none}
    html.locale-zh .i18n-zh{display:inline}
    .empty{color:#8f8067;padding:30px 0}
  </style>
  <link rel="stylesheet" href="craft.css?v=3" />
</head>
<body>
  <div class="wrap">
    <div class="chrome">
      <a class="back" href="/">⟵ <span class="i18n-en">Orrery</span><span class="i18n-zh">星盘</span></a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="btn-en" aria-pressed="true">EN</button>
        <button type="button" id="btn-zh" aria-pressed="false">中文</button>
      </div>
    </div>
    <div class="eyebrow"><span class="i18n-en">Latest</span><span class="i18n-zh">近况</span></div>
    <h1><span class="i18n-en">Latest</span><span class="i18n-zh">近况</span></h1>
    <p class="sub"><span class="i18n-en">Recent preprints, talks, products, and writing. <a class="rss" href="/updates.xml">RSS ↗</a></span><span class="i18n-zh">近期的预印本、报告、产品与写作。<a class="rss" href="/updates.xml">RSS ↗</a></span></p>
    <ol id="feed"><li class="empty">Loading…</li></ol>
  </div>
  <script>
    (function(){
      // language toggle (mirrors the site's i18n)
      var root=document.documentElement;
      function setLang(l){root.className="locale-"+l;document.getElementById("btn-en").setAttribute("aria-pressed",l==="en");document.getElementById("btn-zh").setAttribute("aria-pressed",l==="zh");try{localStorage.setItem("cv-locale",l)}catch(e){}}
      try{var sv=localStorage.getItem("cv-locale");if(sv)setLang(sv)}catch(e){}
      document.getElementById("btn-en").onclick=function(){setLang("en")};
      document.getElementById("btn-zh").onclick=function(){setLang("zh")};
      function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
      fetch("/data/updates.json").then(function(r){return r.json()}).then(function(j){
        var u=(j.updates||[]);var feed=document.getElementById("feed");
        if(!u.length){feed.innerHTML='<li class="empty"><span class="i18n-en">Nothing yet.</span><span class="i18n-zh">暂无更新。</span></li>';return}
        feed.innerHTML=u.map(function(it){
          var en=it.href?'<a class="go" href="'+esc(it.href)+'">'+esc(it.en)+'</a>':esc(it.en);
          var zh=it.href?'<a class="go" href="'+esc(it.href)+'">'+esc(it.zh||it.en)+'</a>':esc(it.zh||it.en);
          return '<li><div class="date">'+esc(it.date)+'</div><div class="body">'+
            '<span class="i18n-en">'+en+'</span><span class="i18n-zh">'+zh+'</span></div></li>';
        }).join("");
      }).catch(function(){document.getElementById("feed").innerHTML='<li class="empty">—</li>';});
    })();
  </script>
  <script src="/magnet.js?v=2"></script>
  <script src="/craft.js?v=1" defer></script>
  <script src="/search.js?v=4" defer></script>
</body>
</html>
