# Deploy the site on every push — the closed loop.
#   push to main          → production  https://jiaxuanchen.pages.dev
#   push to another branch → preview     https://<branch>.jiaxuanchen.pages.dev
# scripts/deploy-pages.sh uploads ONLY the committed files and then verifies that what is
# live is byte-identical to the commit; a mismatch fails this run (GitHub emails you).
#
# One-time setup (until it exists this workflow just skips, it never fails):
#   repo secret   CLOUDFLARE_API_TOKEN   — Cloudflare API token with "Cloudflare Pages: Edit"
#   repo variable CLOUDFLARE_ACCOUNT_ID  — the Cloudflare account that owns project `jiaxuanchen`
name: Deploy site

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials are configured
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set yet — skipping deploy."
            echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 20

      - name: Deploy and verify
        if: steps.gate.outputs.go == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy-pages.sh --branch "${GITHUB_REF_NAME}"
